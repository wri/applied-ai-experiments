  - marimo
  - prompt-engineering
  - ai-summary 

# ---- Demo (when there's something to show) ----
demo:
  enabled: false

# ---- Results (at completion) ----
results:
  summary: >
    Demonstrated feasibility and a possible approach for an automated
    baseline-to-narrative pipeline for geospatial data. However, deforestation
    alert data specifically requires a different interpretation and may not
    ultimately be suited for this baseline-driven approach. 
  lessons:
    - "The seasonal baseline was insufficient: comparing July 2023 only to the prior 12 months misses year-over-year seasonality and needs more historical depth."
    - "LLM narrative quality was high enough to share with partners, but the interpretation of the alerts dataset needs improvement before this pipeline could be used operationally."
    - "The approach is replicable and can be automated, but basic, and has not yet found a use case that generates value."

