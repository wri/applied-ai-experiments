# ---- Results (at completion) ----
results:
  summary: >
    Demonstrated feasibility of an automated baseline-to-narrative pipeline
    for deforestation alert escalation at a Places to Watch site. July 2023
    at Tesso Nilo showed 9,473 alert pixels — 89% above baseline average —
    as part of a sustained multi-month escalation. The LLM-generated
    narrative was well-received by the PTW team as a starting point.
  lessons:
    - "The GFW Integrated Alerts API is queryable by arbitrary polygon and supports SQL filtering, making it well-suited for site-specific analysis."
    - "Populating the prompt variables (especially DATASET_INFO and USER_NEEDS) was the most time-intensive part — getting those right matters more than prompt structure."
    - "The seasonal baseline was insufficient: comparing July 2023 only to the prior 12 months misses year-over-year seasonality and needs more historical depth."
    - "LLM narrative quality was high enough to share with partners, but the interpretation of the alerts dataset needs improvement before this pipeline could be used operationally."
    - "The pipeline is replicable for other PTW sites with minimal changes — the main inputs are the polygon geometry and the target month."

