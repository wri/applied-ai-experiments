# ---- Required ----
slug: deforestation-alerts-baseline                          # Must match directory name
title: "Deforestation Alerts Baseline Analysis"
type: spike                           # evaluation | benchmark | spike | prototype | research | notebook | marimo
status: completed                            # idea | started | paused | completed | archived
description: >
  A proof-of-concept pipeline for generating policy-oriented deforestation
  alert summaries for Places to Watch sites. Queries the GFW Integrated
  Alerts API to build a temporal baseline, analyzes a target month against
  it, and produces a narrative via LLM. Implemented for Tesso Nilo National
  Park, Indonesia (July 2023).

