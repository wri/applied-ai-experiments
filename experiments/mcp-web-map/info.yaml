slug: mcp-web-map
schema_version: 2
title: "MCP Web Map"
type: prototype
status: started
description: >
  Chat-driven control of a MapLibre GL JS map, with two interchangeable tool
  engines you can toggle between at runtime — a hand-rolled client-side bridge
  and the W3C WebMCP standard (navigator.modelContext) — to compare the build
  experience, limitations, and UX of each.

