# ---- Results ----
results:
  summary: >
    Both a custom client-side tool dispatcher and the WebMCP standard
    (navigator.modelContext, via the @mcp-b/webmcp-polyfill) can drive the same
    map + geospatial tools from an in-page LLM chat. WebMCP gives you tool
    registration and automatic input-schema validation "for free", but the
    standard is built for a browser-native agent to consume — driving it from
    your own in-page chat means leaning on producer-preview/extension APIs and a
    static-prompt fallback. The custom bridge is more code but has zero such
    seams.
  lessons:
    - "WebMCP (navigator.modelContext) inverts ownership: the page becomes a tool PROVIDER and the agent is expected to be the browser/native agent. An in-page BYOK chat is off the standard's happy path."
    - "The strict @mcp-b/webmcp-polyfill exposes registerTool + producer-preview getTools()/executeTool(), but NOT the MCP-B callTool()/listTools() extensions — so a real engine needs a fallback chain across those surfaces."
    - "WebMCP validates tool arguments against the registered inputSchema automatically (e.g. a missing required field is rejected before execute runs); the custom bridge has to do that by hand."
    - "There is no synchronous page-side tool enumeration in the strict standard; getTools() is async, so building a system prompt from the registered tools forces either an async prompt path or a static fallback."
    - "Keeping the model-facing protocol identical for both engines (a fenced tool-call block) is what makes the comparison honest — only registration + dispatch differ."
    - "The original 'MCP in a web worker' framing was descoped: tools run on the main thread and the more interesting axis turned out to be standard-vs-custom, not worker-vs-main-thread."

