slug: semantic-document-search
schema_version: 2
title: "Semantic Document Search"
type: prototype
status: started
description: >
  Client-side semantic search tool for PDF documents using browser-based embeddings.
  Load a PDF (or an example), search by meaning, and explore relevance as a page heatmap,
  ranked passages, or score charts. Switch between embedding models, tune chunking strategies,
  and compare configurations side by side — all in the browser, with WebGPU acceleration.

