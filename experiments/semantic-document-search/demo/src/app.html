<!doctype html>

	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<script>
			// Pre-paint theme restore; same "prototype-theme" key as the hub. Falls
			// back to the hub's legacy "theme" key, then system preference.
			(function () {
				var VALID = ['light', 'dark', 'high-contrast'];
				var t = null;
				try {
					t = localStorage.getItem('prototype-theme') || localStorage.getItem('theme');
				} catch (e) {}
				if (VALID.indexOf(t) === -1) {
					t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
				}
				document.documentElement.setAttribute('data-theme', t);
			})();
		</script>
		<script
			id="counterscale-script"
			data-site-id="applied-ai-experiments"
			src="https://counterscale.tilers.workers.dev/tracker.js"
			defer></script>
