name: New Experiment
description: Request scaffolding of a new experiment directory
labels: ["new-experiment"]
body:
  - type: markdown
    attributes:
      value: |
        Fill out this form to automatically scaffold a new experiment.
        A PR will be created with the template files populated from your inputs.

  - type: input
    id: title
    attributes:
      label: Experiment Title
      description: Human-readable name for the experiment
      placeholder: "e.g. LLM Cost-Performance Tradeoffs"
    validations:
      required: true

  - type: input
    id: slug
    attributes:
      label: Slug
      description: >
        Lowercase directory name (letters, numbers, hyphens only).
        Must start and end with a letter or number, 3-60 characters.
      placeholder: "e.g. llm-cost-perf"
    validations:
      required: true

  - type: dropdown
    id: type
    attributes:
      label: Experiment Type
      description: What kind of artifact this is. Separate from the template it's scaffolded from.
      options:
        - spike
        - prototype
        - evaluation
        - benchmark
        - research
        - notebook
        - marimo
    validations:
      required: true

  - type: dropdown
    id: template
    attributes:
      label: Template
      description: >
        Which scaffold to start from. Leave blank to use the template matching
        the type above. `prototype-byok` adds LLM wiring (model selector,
        runLLM, telemetry); `experiment-minimal` is a bare structure.
      options:
        - ""
        - prototype-byok
        - experiment-minimal
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: Description
      description: 1-3 sentences explaining what this experiment is and why it matters
      placeholder: "What question does this experiment answer? Why is it worth exploring?"
    validations:
      required: true

  - type: textarea
    id: falsifiable_signal
    attributes:
      label: Falsifiable success signal
      description: >
        What measurable result would change your mind? Include a number —
        a threshold, sample size, latency/cost figure, or named model.
      placeholder: "e.g. >=3 teams run their first eval in under 60 minutes; p95 latency < 2s on N=50 queries"
    validations:
      required: true

  - type: dropdown
    id: targets
    attributes:
      label: Targets
      description: >
        What conceptual layer this targets — capability (what can the tools
        do?), infra (can we build and run this?), or feature (should we build
        this, and how?)
      options:
        - capability
        - infra
        - feature
    validations:
      required: false

  - type: checkboxes
    id: themes
    attributes:
      label: Themes
      description: Select any applicable themes — the first one you pick is the primary theme
      options:
        - label: cost-perf
        - label: evals
        - label: patterns
        - label: geospatial
        - label: reliability
        - label: agents
        - label: scouting
        - label: prototyping
        - label: development

  - type: input
    id: tags
    attributes:
      label: Tags
      description: Comma-separated free-form tags for search and filtering
      placeholder: "e.g. llm, openai, structured-output"
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Prior art, links, or other notes (included in PR description only)
    validations:
      required: false
