# Bare-bones shape for when no other template fits. `type: spike` below is
# the closest fit from the type enum — "minimal" is a template shape, not a
# type. Change it if the work is really a prototype, evaluation, etc.
# ---- Required ----
title: "CHANGEME"
type: spike                             # evaluation | benchmark | spike | prototype | research | notebook | marimo
status: idea                            # idea | started | paused | done | archived

# ---- Recommended ----
created_at: YYYY-MM-DD
updated_at: YYYY-MM-DD

# ---- Classification ----
targets:                                # capability (what can the tools do?) | infra (can we build and run this?) | feature (should we build this?)
themes: []                              # up to 2; first is primary — cost-perf | evals | patterns | geospatial | reliability | agents | scouting | prototyping | development
tags: []                                # up to 2, free-form — the most distinctive ones; don't restate `type`

# ---- Demo (when there's something to show) ----
demo:
  enabled: false
  type: static                          # static | sveltekit | notebook-html | marimo-html | marimo-wasm | astro
  build_command: ""
  output_dir: ""
