# ---- Required ----
slug: CHANGEME                          # Must match directory name
schema_version: 2
title: "CHANGEME"
type: spike                             # evaluation | benchmark | spike | prototype | research | notebook | marimo
status: idea                            # idea | started | paused | completed | archived
description: >
  CHANGEME: One to two sentences. What is this and why does it matter?

# ---- Recommended ----
owner: "CHANGEME"
created_at: YYYY-MM-DD
updated_at: YYYY-MM-DD

# ---- Classification ----
themes: []                              # cost-perf | evals | patterns | geospatial | reliability | agents | scouting | prototyping
tags: []                                # Free-form, for search and filtering

# ---- Demo (when there's something to show) ----
demo:
  enabled: false
  type: static                          # static | sveltekit | notebook-html | marimo-html | marimo-wasm | astro
  build_command: ""
  output_dir: ""

# ---- Results (at completion) ----
results:
  summary: >
    Brief summary of findings.
  lessons: []                           # Key takeaways that apply beyond this experiment

# ---- Media (optional) ----
# Demo recordings are linked by URL — video files are never committed to the repo.
# Upload to the team bucket or unlisted YouTube/Loom, then reference it here.
