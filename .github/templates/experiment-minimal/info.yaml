#       caption: "90-second walkthrough"
#     - src: https://www.youtube.com/watch?v=XXXX
#       caption: "Team walkthrough (unlisted)"

# ---- Links ----
related_experiments: []                 # Slugs of related experiments
external_links: []                      # [{label: "...", url: "..."}]
